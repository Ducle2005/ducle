spring.application.name=aura-fitness-backend
server.port=${PORT:${SERVER_PORT:8082}}

# Database Configuration
# Local default: H2 file database. Production: set SPRING_DATASOURCE_URL,
# SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD and driver/dialect if needed.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/auradb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

# Hibernate properties
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
server.error.include-message=always

# H2 Console
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Security (JWT)
app.jwt.secret=${APP_JWT_SECRET:ZGV2LXVuc2FmZS1qd3Qtc2VjcmV0LWNoYW5nZS1tZS1pbmUtcHJvZA==}
app.jwt.expiration-milliseconds=${APP_JWT_EXPIRATION_MS:3600000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# File Upload Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# AI Engine
GEMINI_API_KEY=${GEMINI_API_KEY:}
gemini.chat.model=${GEMINI_CHAT_MODEL:gemini-2.5-flash}
gemini.premium.model=${GEMINI_PREMIUM_MODEL:gemini-2.5-flash}
gemini.roadmap.model=${GEMINI_ROADMAP_MODEL:gemini-2.5-flash}
