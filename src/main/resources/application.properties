# H2 Database Properties
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

disk.upload.basepath=${DISK_UPLOAD_BASEPATH:C:\\DAC}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:3000}
app.auth.token-secret=${APP_AUTH_TOKEN_SECRET:}
gemini.api-key=${GEMINI_API_KEY:}
gemini.chat.model=${GEMINI_CHAT_MODEL:gemini-2.5-flash}

spring.jackson.serialization.fail-on-empty-beans=false

server.port=${PORT:${SERVER_PORT:8081}}
